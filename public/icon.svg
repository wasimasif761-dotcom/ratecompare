<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="50%" stop-color="#022c22"/>
      <stop offset="100%" stop-color="#011812"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="neonGreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle border highlight -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Outer Ring Accent -->
  <circle cx="256" cy="256" r="176" fill="none" stroke="url(#neonGreenGrad)" stroke-width="6" stroke-dasharray="16 12" stroke-opacity="0.45"/>
  <circle cx="256" cy="256" r="148" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-opacity="0.2"/>

  <!-- Central Exchange Graphic -->
  <g transform="translate(256, 256)">
    <!-- Top Arrow (Forward Exchange) -->
    <path d="M-80 -40 L50 -40 L50 -70 L100 -25 L50 20 L50 -10 L-80 -10 Z" fill="url(#goldGrad)" filter="url(#glow)"/>
    
    <!-- Bottom Arrow (Return / Compare) -->
    <path d="M80 40 L-50 40 L-50 70 L-100 25 L-50 -20 L-50 10 L80 10 Z" fill="url(#neonGreenGrad)" filter="url(#glow)"/>

    <!-- Center Currency Badge -->
    <circle cx="0" cy="0" r="42" fill="#022c22" stroke="url(#goldGrad)" stroke-width="5"/>
    <text x="0" y="11" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" fill="#fef08a" text-anchor="middle">₨</text>
  </g>

  <!-- Little Star/Sparkle Highlights -->
  <path d="M370 120 L376 134 L390 140 L376 146 L370 160 L364 146 L350 140 L364 134 Z" fill="#fef08a" opacity="0.85"/>
  <path d="M130 360 L134 370 L144 374 L134 378 L130 388 L126 378 L116 374 L126 370 Z" fill="#34d399" opacity="0.85"/>
</svg>
